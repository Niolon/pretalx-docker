name: Docker

on:
  workflow_dispatch: # allows to be run manually
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'

jobs:
  recruitment_tests:
    name: Recruitment privacy tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: privacy_tests
          POSTGRES_PASSWORD: privacy_tests
          POSTGRES_DB: privacy_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacy_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install pinned upstream and plugin test dependencies
        run: python -m pip install -e './pretalx[dev]' -e ./arc/plugin drf-spectacular
      - name: Run recruitment regressions and strict readiness fixtures
        env:
          PRETALX_DB_TYPE: postgresql
          PRETALX_DB_NAME: privacy_tests
          PRETALX_DB_USER: privacy_tests
          PRETALX_DB_PASS: privacy_tests
          PRETALX_DB_HOST: localhost
          PRETALX_DB_PORT: '5432'
        run: |
          export PRETALX_CONFIG_FILE="$PWD/pretalx/src/tests/ci_sqlite.cfg"
          export PRETALX_DATA_DIR="$(mktemp -d)"
          export PYTHONPATH="$PWD/pretalx/src"
          python -m pytest -c arc/plugin/pyproject.toml arc/plugin/tests -q

  build_and_push:
    needs: recruitment_tests
    name: Build and push Docker image to Docker Hub or GHCR
    runs-on: ubuntu-latest
    env:
      push_to_docker_hub: ${{ secrets.DOCKER_USERNAME != null && secrets.DOCKER_PASSWORD != null }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.push_to_docker_hub == 'true' && 'pretalx/standalone' || format('ghcr.io/{0}', github.repository) }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request' && env.push_to_docker_hub == 'true'
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && env.push_to_docker_hub == 'false'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
