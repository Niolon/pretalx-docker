services:
  pretalx:
    depends_on:
      mail:
        condition: service_healthy
    environment:
      # pretalx deliberately switches to its console mail backend in DEBUG
      # mode, so keep this production-like test stack out of DEBUG.
      PRETALX_DEBUG: "False"
      PRETALX_SITE_URL: http://localhost:${ARC_PRETALX_PORT:-8088}
      PRETALX_MAIL_FROM: applications@example.test
      PRETALX_MAIL_HOST: mail
      PRETALX_MAIL_PORT: "1025"
    ports: !override
      - "${ARC_PRETALX_PORT:-8088}:80"

  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${ARC_SMTP_PORT:-1026}:1025"
      - "${ARC_MAILPIT_PORT:-8026}:8025"
