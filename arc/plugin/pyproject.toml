[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pretalx-arc-application"
version = "0.1.0"
description = "Recruitment application schema and privacy guardrails for ARC"
requires-python = ">=3.13"
license = "AGPL-3.0-only"

[project.entry-points."pretalx.plugin"]
pretalx_arc_application = "pretalx_arc_application:PretalxPluginMeta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pretalx.common.settings.test_settings"
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101"]
